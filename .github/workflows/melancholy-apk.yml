name: Melancholy APK (arm64)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture"
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - arm
          - x86_64
          - all

permissions:
  contents: write

concurrency:
  group: melancholy-apk
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_HTTP_MULTIPLEXING: false
      NULLCKI_SHA: "59e02c55e7db054795c66088f946baa80807e84f"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix line endings
        run: |
          find scripts -type f \( -name '*.sh' -o -name 'gradlew' -o -name '*.gradle' -o -name '*.properties' -o -name '*.pro' \) -exec sed -i 's/\r$//' {} +
          find scripts -type f \( -name '*.sh' -o -name 'gradlew' \) -exec chmod +x {} +
          sed -i 's/\r$//' src/game/version.h

      - name: Add prebuilt Android libraries
        run: |
          git clone --depth 1 https://github.com/ddnet/ddnet-libs /tmp/upstream-libs
          find ddnet-libs -type d -name android -prune -exec rm -rf {} +
          rm -rf ddnet-libs/sdl/java
          (cd /tmp/upstream-libs && find . -type d \( -name android -o -path './sdl/java' \) -prune -print) | while read -r d; do
            mkdir -p "ddnet-libs/$d"
            cp -r "/tmp/upstream-libs/$d/." "ddnet-libs/$d/"
          done
          ls ddnet-libs/sdl ddnet-libs/curl

      - name: Prepare Linux
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build openjdk-21-jdk openssl
          curl -LO https://github.com/Kitware/CMake/releases/download/v3.22.1/cmake-3.22.1-Linux-x86_64.tar.gz
          mkdir -p /home/runner/cmake
          tar --strip-components 1 -C /home/runner/cmake -xf cmake-3.22.1-Linux-x86_64.tar.gz
          rustup default 1.92.0
          cargo install cargo-ndk
          rustup target add armv7-linux-androideabi i686-linux-android aarch64-linux-android x86_64-linux-android
          scripts/android/download_android_sdk.sh /home/runner

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/mastersrv
            src/masterping
            ./

      - name: Port KRX Avoid from Nullcki
        run: |
          set -e
          ok=0
          for i in 1 2 3; do
            code=$(curl -L --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -s -o /tmp/nullcki.tgz -w '%{http_code}' "https://codeload.github.com/altynekst/Nullcki/tar.gz/${NULLCKI_SHA}" || echo 000)
            if [ "$code" = "200" ] && [ -s /tmp/nullcki.tgz ] && tar -xzf /tmp/nullcki.tgz -C /tmp; then ok=1; break; fi
            echo "попытка $i не удалась (code=$code)"; sleep 5
          done
          if [ "$ok" != "1" ]; then echo "Nullcki tarball не скачался"; exit 1; fi
          NKDIR="$(tar -tzf /tmp/nullcki.tgz | head -n1 | cut -d/ -f1)"
          test -n "$NKDIR" && test -d "/tmp/$NKDIR/src/game/client/avoid" || { echo "В тарболле Nullcki нет src/game/client/avoid (папка: $NKDIR)"; exit 1; }
          printf '%s' "" | base64 -d | gunzip > /tmp/patch_melancholy.py
          NULLCKI_SRC="/tmp/$NKDIR" python3 /tmp/patch_melancholy.py

      - name: Build APK
        env:
          TW_KEY_NAME: /home/runner/App.jks
          TW_KEY_ALIAS: "Tapk-Key"
        run: |
          printf '%s' "" | base64 -d > /home/runner/App.jks
          export TW_KEY_PW="TapkSign2026"
          export TW_VERSION_CODE="$(grep '#define DDNET_VERSION_NUMBER' src/game/version.h | awk '{print $3}' | tr -d '\r')"
          export TW_VERSION_NAME="$(grep '#define GAME_RELEASE_VERSION_INTERNAL' src/game/version.h | awk '{print $3}' | tr -d '\r')"
          echo "version: $TW_VERSION_NAME ($TW_VERSION_CODE)"
          export ANDROID_HOME="/home/runner/Android/Sdk"
          unset ANDROID_SDK_ROOT
          export PATH=/home/runner/cmake/bin:$PATH
          scripts/android/cmake_android.sh "${{ inputs.arch || 'arm64' }}" Melancholy org.ddnet.client Release build-melancholy
          mkdir artifacts
          mv build-melancholy/Melancholy.apk artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: melancholy-android-${{ inputs.arch || 'arm64' }}
          path: artifacts

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "melancholy-v${{ github.run_number }}" artifacts/*.apk \
            --title "Melancholy v${{ github.run_number }} (19.8 + KRX Avoid)" \
            --notes "Melancholy = kernet + порт крх-авойда из Nullcki @ ${NULLCKI_SHA}.
          Вкладка: Настройки -> KernelNet -> Avoid (дропдаун агентов: Basic/Legit/Blatant/Fent Bot/Pilot Bot).
          Ставится поверх прошлых сборок melancholy — подпись та же." \
            --latest || gh release upload "melancholy-v${{ github.run_number }}" artifacts/*.apk --clobber
